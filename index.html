<html>
<head>
    <meta charset="utf-8">
    <meta name="description" content="WebRTC code samples">
    <meta name="viewport" content="width=device-width, user-scalable=yes, initial-scale=1">
    <meta itemprop="description" content="Client-side WebRTC code samples">
    <meta itemprop="image" content="../../../images/webrtc-icon-192x192.png">
    <meta itemprop="name" content="WebRTC code samples">
    <meta name="mobile-web-app-capable" content="yes">
    <meta id="theme-color" name="theme-color" content="#ffffff">

    <base target="_blank">
    <title>WebRTC Filter App</title>
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700" rel="stylesheet" type="text/css">
    <style>
        body {
            background-color: #0a192f; 
            color: white;
            font-family: 'Roboto', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .control-panel {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            gap: 20px;
            align-items: center;
            border: 1px solid #172a45;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        video {
            width: 400px;
            height: 400px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #64ffda;
            background-color: #000;
        }

        canvas {
            display: none;
        }

        .none { filter: none; }
        
        .blur { 
            -webkit-filter: blur(calc(var(--intensity) * 10px));
            filter: blur(calc(var(--intensity) * 10px)); 
        }

        .grayscale { 
            -webkit-filter: grayscale(var(--intensity));
            filter: grayscale(var(--intensity)); 
        }

        .invert { 
            -webkit-filter: invert(var(--intensity));
            filter: invert(var(--intensity)); 
        }

        .sepia { 
            -webkit-filter: sepia(var(--intensity));
            filter: sepia(var(--intensity)); 
        }

        .hue { 
            -webkit-filter: hue-rotate(calc(var(--intensity) * 360deg));
            filter: hue-rotate(calc(var(--intensity) * 360deg)); 
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
            background-color: #64ffda;
            border: none;
            border-radius: 5px;
            color: #0a192f;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>WebRTC Filter App</h1>

    <div class="control-panel">
        <div class="control-group">
            <label for="threshold">Spalvos pakeitimas: <span id="threshVal">0</span>°</label>
            <input type="range" id="threshold" min="0" max="360" value="0">
        </div>

        <div class="control-group">
            <label for="filter">Filter:</label>
            <select id="filter">
                <option value="none">None</option>
                <option value="blur">Blur</option>
                <option value="grayscale">Grayscale</option>
                <option value="invert">Invert</option>
                <option value="sepia">Sepia</option>
                <option value="hue">Hue rotation</option>
            </select>
        </div>

        <button id="snapshot">Take snapshot</button>
    </div>

    <video playsinline autoplay></video>
    
    <canvas></canvas>

    <script src="https://webrtc.github.io/adapter/adapter-latest.js"></script>
    <script src="main.js"></script>
</body>
</html>
